name: Adaptive Climate offline evaluation
on:
  push:
    paths:
      - 'AdaptiveClimate/evaluation/**'
      - 'AdaptiveClimate/components/adaptive_climate/thermal_model.h'
      - '.github/workflows/adaptive-evaluation.yml'
  pull_request:
    paths:
      - 'AdaptiveClimate/evaluation/**'
      - 'AdaptiveClimate/components/adaptive_climate/thermal_model.h'
      - '.github/workflows/adaptive-evaluation.yml'
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile unchanged production observer replay
        run: g++ -std=c++17 -O2 AdaptiveClimate/evaluation/replay.cpp -o "$RUNNER_TEMP/adaptive-replay"
      - name: Run scoring and replay tests
        env:
          ADAPTIVE_REPLAY_EXE: ${{ runner.temp }}/adaptive-replay
        run: python -m unittest discover -s AdaptiveClimate/evaluation -p 'test_*.py'
