# COMPILE/REGRESSION FIXTURE ONLY: includes existing PID/OpenTherm packages.
# Placeholder credentials and PID values. Never deploy this fixture.
# Use stijn_integration.yaml to amend your existing thermostat instead.
esphome:
  name: adaptive-stijn-device-check
  name_add_mac_suffix: false
  friendly_name: Thermostaat
  devices:
  - id: climate_stijn
    name: Climate Stijn
    area_id: kamer_stijn
  - id: climate_nick
    name: Climate Nick
    area_id: kamer_nick
  - id: adaptive_climate_stijn
    name: Adaptive Climate Stijn
    area_id: kamer_stijn
  areas:
  - id: kamer_stijn
    name: Kamer Stijn
  - id: kamer_nick
    name: Kamer Nick
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
  level: info
ota:
- platform: esphome
  password: CHANGE_ME_OTA_PASSWORD
api:
  encryption: {}
wifi:
  ssid: CHANGE_ME
  password: CHANGE_ME_PASSWORD
substitutions:
  update_interval: 5s
packages:
  original_0: !include
    file: ../../Thermostat/OpenTherm.yaml
    vars:
      outputId: t_set
      boiler_enable: boiler_enable
      boiler_active: boiler_active
      openthermPin:
        ot_in: 21
        ot_out: 22
  original_1: !include
    file: ../../Thermostat/ThermostatOutputCalculation.yaml
    vars:
      water_temp:
        min_temp: '40'
        max_temp: '70'
      opentherm_update_interval: ${update_interval}
      output_entity_name: t_set
      boiler_enable: boiler_enable
      outside_temp_sensor: sensor.temperature
      pid_output:
        room_1: pid_output_1
        room_2: pid_output_2
  original_2: !include
    file: ../../Thermostat/ClimatePID/ClimateDevice.yaml
    vars:
      device:
        id: climate_stijn
        name: Climate Stijn
      climate:
        id: heating_1
        name: Verwarming 1
        pid_output: pid_output_1
        boiler_active: boiler_active
        interval: ${update_interval}
      control:
        autotune:
          noiseband: 0.5
          positive_output: 100%
          negative_output: 0%
        pid:
          kp: 1.0
          ki: 1.0
          kd: 1.0
        clamp:
          i_min: 0.0
          i_max: 1.0
        averaging:
          derivative: 10
          output: 1
        deadband:
          threshold:
            low: '-0.30'
            high: '0.30'
          multiplier:
            kp: 0.2
            ki: 0.25
            kd: 0.75
          averaging:
            output: 28
      sensor:
        temperature: sensor.temperature_sensor_room_1
        humidity: sensor.humidity_sensor_room_1
        window: binary_sensor.window_contact_sensor_room_1
      master: climate.master_home_assistant_generic_thermostat_1
  original_3: !include
    file: ../../Thermostat/ClimatePID/ClimateDevice.yaml
    vars:
      device:
        id: climate_nick
        name: Climate Nick
      climate:
        id: heating_2
        name: Heating 2
        pid_output: pid_output_2
        boiler_active: boiler_active
        interval: ${update_interval}
      control:
        autotune:
          noiseband: 0.5
          positive_output: 100%
          negative_output: 0%
        pid:
          kp: 1.0
          ki: 1.0
          kd: 1.0
        clamp:
          i_min: 0.0
          i_max: 1.0
        averaging:
          derivative: 10
          output: 1
        deadband:
          threshold:
            low: '-0.30'
            high: '0.30'
          multiplier:
            kp: 0.2
            ki: 0.25
            kd: 0.75
          averaging:
            output: 28
      sensor:
        temperature: sensor.temperature_sensor_room_2
        humidity: sensor.humidity_sensor_room_2
        window: binary_sensor.window_contact_sensor_room_2
      master: climate.master_home_assistant_generic_thermostat_2
  original_4: !include
    file: ../../Thermostat/ClimatePID/ClimateDebugSensors.yaml
    vars:
      device:
        id: climate_stijn
        name: Climate Stijn
      climateId: heating_1
      disabled:
        error: 'false'
        multiplier: 'false'
        heatOutput: 'false'
        coolOutput: 'true'
      updateInterval: ${update_interval}
  original_5: !include
    file: ../../Thermostat/ClimatePID/ClimateDebugSensors.yaml
    vars:
      device:
        id: climate_nick
        name: Climate Nick
      climateId: heating_2
      disabled:
        error: 'false'
        multiplier: 'false'
        heatOutput: 'false'
        coolOutput: 'true'
      updateInterval: ${update_interval}
  stijn_observer: !include
    file: ../ObserveRoom.yaml
    vars:
      device:
        id: adaptive_climate_stijn
        name: Adaptive Climate Stijn
      observer_id: stijn_thermal_model
      observer_name: Stijn
      room_temperature_id: climate_stijn_temperature
      outdoor_temperature_id: outside_temperature_sensor
      valve_command_id: climate_stijn_valve_opening_degree
      supply_temperature_id: ch_temperature
      heating_active_id: boiler_active
      window_open_id: climate_stijn_window
      dhw_active_id: dhw_active
external_components:
- source:
    type: local
    path: ../components
  components:
  - adaptive_climate
