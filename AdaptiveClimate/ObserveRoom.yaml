# Required include vars: observer_id, observer_name, room_temperature_id,
# outdoor_temperature_id, valve_command_id, supply_temperature_id,
# heating_active_id, window_open_id, dhw_active_id.
# All input references are existing ESPHome IDs, not Home Assistant entity IDs.
# Load components/adaptive_climate once in the containing configuration.
substitutions:
  observer_stale_after: 15min

adaptive_climate:
  - id: ${observer_id}
    mode: observe
    room_temperature: ${room_temperature_id}
    outdoor_temperature: ${outdoor_temperature_id}
    valve_command: ${valve_command_id}
    supply_temperature: ${supply_temperature_id}
    heating_active: ${heating_active_id}
    window_open: ${window_open_id}
    dhw_active: ${dhw_active_id}
    stale_after: ${observer_stale_after}
    prediction_15min:
      name: "${observer_name} Forecast 15min"
    prediction_30min:
      name: "${observer_name} Forecast 30min"
    prediction_60min:
      name: "${observer_name} Forecast 60min"
    residual_rmse:
      name: "${observer_name} Model Residual RMSE"
    training_samples:
      name: "${observer_name} Model Training Samples"
    heating_excitation:
      name: "${observer_name} Model Heating Excitation"
    status:
      name: "${observer_name} Model Status"
