substitutions:
  water_temp:
    min_temp: "40" 
    max_temp: "70"
  opentherm_update_interval: 15s
  output_entity_name: T_set
  boiler_enable: boiler_enable
  outside_temp_sensor: sensor.outside_temp
  pid_output:
    room_1: esphome_entity
    room_2: esphome_entity

# --- Outside temperature from HA
sensor:
  - platform: homeassistant
    id: outside_temperature_sensor
    entity_id: ${outside_temp_sensor}
    internal: false

  - platform: exponential_moving_average
    id: outside_temperature_smoothed
    name: "Outside Temperature Smoothed"
    sensor: outside_temperature_sensor
    unit_of_measurement: "°C"
    icon: mdi:coolant-temperature
    time_constant: 6h
    time_weighting: previous
    restore: true
    
   # Final target exposed for writer
  - platform: template
    id: target_water_temperature
    name: "Target Water Temperature"

    unit_of_measurement: "°C"
    accuracy_decimals: 1
    icon: mdi:coolant-temperature

    update_interval: ${opentherm_update_interval}

    filters:
      - round: 0

    lambda: |-
      // ==========================================
      // Weather compensation configuration
      // ==========================================

      // Outside temperature reference points
      const float T_OUT_COLD = 0.0f;
      const float T_OUT_WARM = 15.0f;

      // Flow temperature limits
      const float T_SUPPLY_MIN = ${water_temp.min_temp};
      const float T_SUPPLY_MAX = ${water_temp.max_temp};

      // Fallback flow temperature
      const float T_FALLBACK = 60.0f;

      // Plausible outside temperature range
      const float T_OUT_MIN_VALID = -30.0f;
      const float T_OUT_MAX_VALID = 45.0f;

      // ==========================================
      // Read outside temperature
      // ==========================================

      const float outdoor =
          id(outside_temperature_smoothed).state;

      // ==========================================
      // Validate sensor
      // ==========================================

      if (!id(outside_temperature_smoothed).has_state() ||
          !std::isfinite(outdoor) ||
          outdoor < T_OUT_MIN_VALID ||
          outdoor > T_OUT_MAX_VALID) {

        // Clamp fallback to configured limits
        float fallback = T_FALLBACK;

        if (fallback < T_SUPPLY_MIN)
          fallback = T_SUPPLY_MIN;

        if (fallback > T_SUPPLY_MAX)
          fallback = T_SUPPLY_MAX;

        return fallback;
      }

      // ==========================================
      // Linear weather compensation
      // ==========================================

      const float slope =
          (T_SUPPLY_MIN - T_SUPPLY_MAX) /
          (T_OUT_WARM - T_OUT_COLD);

      float target =
          T_SUPPLY_MAX +
          slope * (outdoor - T_OUT_COLD);

      // ==========================================
      // Clamp target flow temperature
      // ==========================================

      if (target < T_SUPPLY_MIN)
        target = T_SUPPLY_MIN;

      if (target > T_SUPPLY_MAX)
        target = T_SUPPLY_MAX;

      return target;





binary_sensor:
# --- Any valve open?
  - platform: template
    id: any_valve_open
    lambda: |-
      return (id(${pid_output.room_1}).state >= 1.0f) || (id(${pid_output.room_2}).state >= 1.0f);
 
# --- CH enable logic
  - platform: template
    id: ch_should_enable
    lambda: |-
      if(id(any_valve_open).state)
      {
        id(${boiler_enable}).turn_on();
        return true;
      } else {
        id(${boiler_enable}).turn_off();
        return false;
      }
      return false;

# --- Writer
interval:
  - interval: ${opentherm_update_interval}
    then:
      - lambda: |-
          float target = id(target_water_temperature).state;
          bool enable  = id(ch_should_enable).state;

          if (!isnan(target)) {
            if (enable) {
              id(${output_entity_name}).set_level(target / 70.0f);
            } else {
              id(${output_entity_name}).set_level(0.0f);
            }
          }
