adaptive_climate:
  - id: !extend stijn_thermal_model
    shadow_model: true
    model_record:
      name: Stijn Reference Model Details
      device_id: adaptive_climate_stijn
    shadow_record:
      name: Stijn Shadow Model Details
      device_id: adaptive_climate_stijn
    shadow_forecasts:
      name: Stijn Shadow Conditional Forecasts
      device_id: adaptive_climate_stijn
    cycle_record:
      name: "Stijn Observation Cycle"
      device_id: adaptive_climate_stijn
  - id: !extend nick_thermal_model
    shadow_model: true
    model_record:
      name: Nick Reference Model Details
      device_id: adaptive_climate_nick
    shadow_record:
      name: Nick Shadow Model Details
      device_id: adaptive_climate_nick
    shadow_forecasts:
      name: Nick Shadow Conditional Forecasts
      device_id: adaptive_climate_nick
    cycle_record:
      name: "Nick Observation Cycle"
      device_id: adaptive_climate_nick
