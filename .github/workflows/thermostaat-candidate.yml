name: Complete thermostat candidate (build only)
on:
  push:
    branches: [feature/adaptive-climate-prediction-evaluation]
    paths: ['AdaptiveClimate/deployment/**', 'AdaptiveClimate/components/**', '.github/workflows/thermostaat-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r AdaptiveClimate/requirements-test.txt
      - name: Supply non-production compile credentials
        run: cp AdaptiveClimate/deployment/secrets.compile-only.yaml AdaptiveClimate/deployment/secrets.yaml
      - name: Validate complete supplied configuration
        run: esphome config AdaptiveClimate/deployment/thermostaat.yaml
      - name: Compile complete supplied configuration without upload
        run: esphome compile AdaptiveClimate/deployment/thermostaat.yaml
      - name: Compile opt-in two-room shadow candidate without upload
        run: esphome compile AdaptiveClimate/deployment/thermostaat_shadow.yaml
